[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custommaker"
# a versão vem de src/version.py (a mesma que o app mostra e o CI confere na tag)
dynamic = ["version"]
description = "Desktop editor for Mudae custom card workflows."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-generativeai==0.8.5",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "pillow==10.4.0",
    "PySide6==6.12.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
]

[tool.setuptools.dynamic]
version = { attr = "src.version.__version__" }

# o app importa "src.core...": sem isto o setuptools tratava src/ como layout
# "src" e instalava core/, qt/... soltos (o pip install . nunca funcionou)
[tool.setuptools.packages.find]
include = ["src", "src.*"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_pool: usa o pool de processos de verdade (o padrão nos testes é threads, para economizar RAM)",
]
# teste travado por mais de 2 min: despeja as pilhas de todas as threads
faulthandler_timeout = 120
