name: Testes

on:
  push:
    branches: [main]
  pull_request:

# um push novo cancela a execução anterior ainda em andamento na mesma branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Windows, como os usuários: spawn do ProcessPool, caminhos e Explorer
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # widgets Qt sem tela; fontes do sistema para os testes que renderizam
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Rodar testes
        run: python -m pytest -q --junitxml=test-report.xml

      # falhas viram anotações no resumo da execução, legíveis sem abrir o log
      - name: Anotar falhas
        if: failure()
        run: python .github/scripts/annotate_failures.py test-report.xml
