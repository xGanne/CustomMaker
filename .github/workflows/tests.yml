name: Testes

on:
  push:
    branches: [main]
    # tag de versão (ex.: v1.1.0): além dos testes, publica a Release com o exe
    tags: ['v*']
  pull_request:

# um push novo cancela a execução anterior ainda em andamento na mesma branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Windows, como os usuários: spawn do ProcessPool, caminhos e Explorer
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # widgets Qt sem tela; fontes do sistema para os testes que renderizam
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      # -vv (o pyproject já passa -q) imprime cada teste antes de rodá-lo: se o processo morrer, a última
      # linha da saída mostra onde. Teste reprovado (código 1) reprova o CI na hora; um crash nativo
      # do Qt (o processo morre sem reprovar nenhum teste) roda a suíte de novo uma vez e fica
      # registrado como aviso, com o log do crash anotado — sem esconder um crash que se repete.
      - name: Rodar testes
        shell: bash
        run: |
          set -o pipefail
          run_tests() {
            python -X faulthandler -m pytest -vv --junitxml=test-report.xml 2>&1 | tee pytest-output.txt
          }
          status=0
          run_tests || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            last=$(grep -E "::.* (PASSED|FAILED)|::[^ ]+ $" pytest-output.txt | tail -n 1)
            echo "::warning title=Crash nativo nos testes (código $status) — rodando de novo::último teste: ${last:-desconhecido}"
            cp pytest-output.txt pytest-output-crash.txt
            status=0
            run_tests || status=$?
          fi
          exit "$status"

      # falhas viram anotações no resumo da execução, legíveis sem abrir o log
      - name: Anotar falhas
        if: failure()
        run: python .github/scripts/annotate_failures.py test-report.xml pytest-output.txt

  exe:
    # Empacota o CustomMaker.exe e roda o autoteste nele: valida o que só
    # quebra no executável (pool de processos, assets e traduções embutidos)
    needs: pytest
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write  # criar a Release nas tags de versão
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Gerar o executável
        run: pyinstaller --noconfirm --log-level WARN CustomMaker.spec

      - name: Autoteste no executável
        shell: bash
        run: ./dist/CustomMaker.exe --self-test selftest-report.txt

      - name: Anotar resultado do autoteste
        if: always()
        shell: bash
        run: |
          if [ -f selftest-report.txt ]; then
            cat selftest-report.txt
            if grep -q "FALHOU" selftest-report.txt; then
              echo "::error title=Autoteste do exe falhou::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' selftest-report.txt)"
            fi
          else
            echo "::error title=Autoteste do exe::o executável não gerou o relatório (travou ou não abriu)"
          fi

      # modo linha de comando no exe: 3 imagens sintéticas → ZIP com 3 customs 225x350
      - name: Modo --batch no executável
        shell: bash
        run: |
          python -c "from PIL import Image; import os; os.makedirs('batch-in', exist_ok=True); [Image.new('RGB', (400 + 40 * i, 600), (60 * i, 90, 160)).save(f'batch-in/i{i}.png') for i in range(3)]"
          ./dist/CustomMaker.exe --batch batch-in --zip batch-out.zip --report batch-report.txt
          python -c "import zipfile, io; from PIL import Image; z = zipfile.ZipFile('batch-out.zip'); names = sorted(z.namelist()); sizes = {Image.open(io.BytesIO(z.read(n))).size for n in names}; assert names == ['i0_custom.png', 'i1_custom.png', 'i2_custom.png'] and sizes == {(225, 350)}, (names, sizes); print('ZIP ok:', names)"

      - name: Anotar resultado do --batch
        if: failure()
        shell: bash
        run: |
          if [ -f batch-report.txt ]; then
            echo "::error title=--batch do exe falhou::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' batch-report.txt)"
          else
            echo "::error title=--batch do exe::o executável não gerou o relatório"
          fi

      - name: Publicar o executável
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: CustomMaker-${{ github.sha }}
          path: |
            dist/CustomMaker.exe
            selftest-report.txt
          retention-days: 14

      # tag v<versão>: confere com src/version.py e publica a Release com o exe
      # (o app consulta a última Release para avisar de versão nova)
      - name: Publicar Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(python -c "from src.version import __version__; print(__version__)")
          if [ "$tag" != "v$version" ]; then
            echo "::error title=Versão não bate::a tag é $tag, mas src/version.py diz $version"
            exit 1
          fi
          gh release create "$tag" dist/CustomMaker.exe --title "Custom Maker $version" --generate-notes
